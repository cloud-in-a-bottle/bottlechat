[app]
name = "bottlechat"
version = "0.1.0"
description = "A chat UI for the LLM models configured in your Bifrost gateway."
authors = ["Zack Polizzi"]

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"
# Only the share surface is public.  `/share/*` serves the read-only transcript page and its
# JSON API, keyed by an unguessable token.  The rest are the static files that page pulls in —
# the built bundle, icons, favicon, manifest, service worker.  Code and images only: every route
# that can reach chat data lives under `/api/*`, which stays owner-gated (and re-checks the owner
# header).  `/sw.js` is here because a redirect to /login fails service-worker registration
# outright, and whether the browser attaches credentials to a worker script fetch isn't something
# to bet PWA install on.
public_paths = ["/share", "/assets", "/icons", "/favicon.svg", "/manifest.webmanifest", "/sw.js"]

[resources]
memory_mb = 512
build_memory_mb = 4096
cpu_cores = 1.0

[data]
sqlite = ["chats"]

# LLM inference.  Provided by the Bifrost gateway app (or any other app exposing
# the same OpenAI-compatible service).  If nothing provides it, the app renders a
# setup screen telling the owner to install a provider.
[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost-bifrost-llm-gateway/services/openai-compat"
shortname = "llm"
version = ">=0.1.0"
grants = ["full_access"]
